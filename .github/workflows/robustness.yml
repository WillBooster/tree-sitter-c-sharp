name: Robustness
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  paired-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@v5.2.0
      - run: bun install --frozen-lockfile
      - name: Build exact base and patched Wasm artifacts
        run: |
          mkdir -p .tmp/paired
          git worktree add --detach .tmp/paired/base 2eac543053150f05f0d42b26490fc5da7898fe23
          script/tree-sitter build --wasm --output .tmp/paired/head.wasm
          script/tree-sitter build --wasm --output .tmp/paired/base.wasm .tmp/paired/base
          shasum -a 256 .tmp/paired/base.wasm .tmp/paired/head.wasm
      - name: Compare exact full performance suites and parser preconditioning
        run: |
          set -o pipefail
          node script/diagnoseFullPerformance.mjs | tee .tmp/paired/full-results.log
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: paired-intel-full-performance
          path: .tmp/paired/full-*
          retention-days: 7
