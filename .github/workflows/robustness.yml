name: Robustness
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  paired-intel:
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      EMCC_CORES: 2
      BINARYEN_CORES: 2
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@v5.2.0
      - run: bun install --frozen-lockfile
      - name: Build immutable main and query-only PR inputs in separate caches
        run: |
          set -euo pipefail
          mkdir -p .tmp/paired
          git worktree add --detach .tmp/paired/base 9427feeeac846e85237f77826f30e061e44626c8
          git worktree add --detach .tmp/paired/head 158f2abb9dfaa83ad376eb1354fef6ccde256667
          for artifact in base head; do
            (cd ".tmp/paired/$artifact" && export TREE_SITTER_LIBDIR="$PWD/.tmp/tree-sitter-lib" && bun install --frozen-lockfile && script/generate --build-wasm && git diff --exit-code -- src/)
            cp ".tmp/paired/$artifact/tree-sitter-c_sharp.wasm" ".tmp/paired/$artifact-canonical.wasm"
          done
          shasum -a 256 .tmp/paired/base-canonical.wasm .tmp/paired/head-canonical.wasm
      - name: Compare all99 unchanged performance checks in ABBA order
        run: |
          set -euo pipefail
          mise exec -- node script/diagnoseHighlightPerformance.mjs | tee .tmp/paired/full-results.log
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: highlight-property-intel-performance
          path: |
            .tmp/paired/full-*
            .tmp/paired/*-canonical.wasm
          retention-days: 7
