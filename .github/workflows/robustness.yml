name: Robustness
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  paired-intel:
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      EMCC_CORES: 2
      BINARYEN_CORES: 2
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@v5.2.0
      - run: bun install --frozen-lockfile
      - run: bun run test/ci-setup
      - name: Build immutable source inputs in separate parser caches
        run: |
          set -euo pipefail
          mkdir -p .tmp/paired
          git worktree add --detach .tmp/paired/base 0846edff371bf81fec10c6c74b0da1e11625beab
          git worktree add --detach .tmp/paired/head 990ee5b190b9a05ee5b00a4a98976d5a71628773
          for artifact in base head; do
            (cd ".tmp/paired/$artifact" && export TREE_SITTER_LIBDIR="$PWD/.tmp/tree-sitter-lib" && bun install --frozen-lockfile && script/generate --build-wasm && git diff --exit-code -- src/)
          done
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          let response=await fetch('https://registry.npmjs.org/@willbooster%2Ftree-sitter-c-sharp/8.0.3');
          let metadata;
          if(response.status===404){response=await fetch('https://registry.npmjs.org/@willbooster%2Ftree-sitter-c-sharp');assert(response.ok);metadata=(await response.json()).versions['8.0.3'];}
          else{assert(response.ok);metadata=await response.json();}
          assert.equal(metadata.version,'8.0.3');assert.equal(metadata.gitHead,'0846edff371bf81fec10c6c74b0da1e11625beab');
          assert.equal(metadata.dist.integrity,'sha512-JtAfrtobdUwpzMKEEOdxtv2tOMxmrGd24IN06zx09IWVvHyA0z9/jBXbyW6u8pHOYfA2uZ44bTeXojDF+TbPiQ==');
          const tar=await fetch(metadata.dist.tarball);assert(tar.ok);const bytes=Buffer.from(await tar.arrayBuffer());
          assert.equal('sha512-'+createHash('sha512').update(bytes).digest('base64'),metadata.dist.integrity);
          fs.writeFileSync('.tmp/paired/public803.tgz',bytes);fs.writeFileSync('.tmp/paired/npm803-metadata.json',JSON.stringify(metadata,null,2));
          JS
          mkdir -p .tmp/paired/public803
          tar -xzf .tmp/paired/public803.tgz -C .tmp/paired/public803 package/tree-sitter-c_sharp.wasm
          cp .tmp/paired/base/tree-sitter-c_sharp.wasm .tmp/paired/base-canonical.wasm
          cp .tmp/paired/head/tree-sitter-c_sharp.wasm .tmp/paired/head-canonical.wasm
          cp .tmp/paired/public803/package/tree-sitter-c_sharp.wasm .tmp/paired/base/tree-sitter-c_sharp.wasm
          shasum -a 256 .tmp/paired/base/tree-sitter-c_sharp.wasm .tmp/paired/head/tree-sitter-c_sharp.wasm
      - name: Compare all339 unchanged checks in AB then BA order
        run: |
          set -euo pipefail
          node script/diagnoseTernaryPerformance.mjs | tee .tmp/paired/full-results.log
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: conditional-ternary-intel-performance
          path: |
            .tmp/paired/full-*
            .tmp/paired/npm803-metadata.json
          retention-days: 7
