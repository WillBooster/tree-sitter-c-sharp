name: Robustness
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  paired-intel:
    runs-on: macos-15-intel
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@v5.2.0
      - run: bun install --frozen-lockfile
      - name: Build canonical current main and pragma artifacts
        run: |
          mkdir -p .tmp/paired
          git worktree add --detach .tmp/paired/base b9cda730a594148a4ec0700c6ab3321d08549af2
          git worktree add --detach .tmp/paired/head 4793c4de4b2ab9d694f677d1286b3e0ebef41017
          for artifact in base head; do
            (cd .tmp/paired/$artifact && bun install --frozen-lockfile && script/generate --build-wasm)
            cp .tmp/paired/$artifact/tree-sitter-c_sharp.wasm .tmp/paired/$artifact.wasm
          done
          shasum -a 256 .tmp/paired/base.wasm .tmp/paired/head.wasm
      - name: Compare canonical full performance suites and parser preconditioning
        run: |
          set -o pipefail
          node script/diagnoseFullPerformance.mjs | tee .tmp/paired/full-results.log
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: paired-intel-full-performance
          path: .tmp/paired/full-*
          retention-days: 7
