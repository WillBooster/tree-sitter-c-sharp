name: Robustness
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  paired-intel:
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@v5.2.0
      - run: bun install --frozen-lockfile
      - name: Build exact main and integrated PR grammars
        run: |
          set -euo pipefail
          mkdir -p .tmp/paired
          git worktree add --detach .tmp/paired/base cf4b659fee033bd00ac5be800c8052acfb54f637
          git worktree add --detach .tmp/paired/head 29e70304e3cddbd7c8d138d2d046cbe184fd75bf
          for artifact in base head; do
            (cd ".tmp/paired/$artifact" && bun install --frozen-lockfile && script/generate --build-wasm && git diff --exit-code -- src/)
            cp ".tmp/paired/$artifact/tree-sitter-c_sharp.wasm" ".tmp/paired/$artifact.wasm"
          done
          shasum -a 256 .tmp/paired/base.wasm .tmp/paired/head.wasm
      - name: Compare unchanged full performance files in AB and BA order
        run: |
          set -euo pipefail
          node script/diagnoseConditionalBasePerformance.mjs | tee .tmp/paired/full-results.log
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: conditional-base-intel-performance
          path: .tmp/paired/full-*
          retention-days: 7
